<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEE RELATED</title>
    
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Archivo+Black&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Archivo Black', sans-serif; 
            background-color: #ffffff; 
            color: #000000; 
            margin: 0; 
            padding-top: 60px; 
            text-align: center; 
            overflow-x: hidden;
        }

        /* Fixed Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #ffffff;
            border-bottom: 5px solid #000;
            z-index: 1000;
            padding: 10px 0;
        }
        nav a {
            text-decoration: none;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 15px;
            font-size: 0.8rem;
        }

        /* --- LAYERED HERO SECTION --- */
        .hero-container {
            position: relative;
            height: 80vh;
            background-color: #000000; /* The black block base */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 10px solid #000;
        }
        .hero-text-bg {
            position: absolute;
            font-size: 18vw;
            font-weight: 900;
            color: #1a1a1a; /* Dark grey text on black background */
            text-transform: uppercase;
            white-space: nowrap;
            z-index: 1;
            letter-spacing: -5px;
            user-select: none;
        }
        .hero-logo {
            position: relative;
            max-height: 60%;
            max-width: 80%;
            z-index: 2;
            /* Optional: remove border if you want the logo to float */
            border: 4px solid #fff; 
        }

        /* --- UNIFORM IMAGE SIZING --- */
        section { padding: 80px 20px; max-width: 1100px; margin: auto; }
        
        h2 { 
            font-size: 3.5rem; 
            text-transform: uppercase; 
            margin-bottom: 40px;
            letter-spacing: -2px;
        }

        .standard-img {
            width: 100%;
            max-width: 650px; 
            height: 450px;    
            object-fit: cover; 
            border: 8px solid #000;
        }

        .caption {
            font-size: 1.2rem;
            font-weight: 900;
            margin-top: 15px;
            text-transform: uppercase;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 8px 20px;
        }

        /* --- MERCH SECTION --- */
        #merch { background: #000; color: #fff; padding: 120px 20px; }
        .old-english-clean { 
            font-family: 'Almendra Display', serif; 
            font-size: 6rem; 
            color: #ff0000; 
            margin: 0;
        }

        .video-wrapper { 
            margin-bottom: 50px;
            border: 8px solid #000;
            max-width: 850px;
            margin-left: auto;
            margin-right: auto;
        }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .booking-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .booking-img-small { width: 320px; height: 320px; object-fit: cover; border: 8px solid #000; }

        .btn {
            background: #000;
            color: #fff;
            padding: 20px 50px;
            text-decoration: none;
            font-size: 1.8rem;
            font-weight: 900;
            display: inline-block;
            margin-top: 30px;
            border: 4px solid #fff;
        }

        footer { background: #000; color: #fff; padding: 50px; font-weight: bold; }
        hr { border: 0; border-top: 10px solid #000; margin: 0; }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#merch">Merch</a>
        <a href="#visuals">Visuals</a>
        <a href="#booking">Booking</a>
    </nav>

    <div class="hero-container">
        <div class="hero-text-bg">GEE RELATED</div>
        <img src="images/black_white.jpg" alt="Gee Related Logo" class="hero-logo">
    </div>

    <section id="home">
        <h2>THE KREW</h2>
        <img src="images/krew.JPG" alt="The Krew" class="standard-img">
        <br>
        <p class="caption">Prozik & Rocio Gee</p>
    </section>

    <hr>

    <section id="about">
        <h2>ABOUT</h2>
        <img src="images/mic.JPG" alt="Bio" class="standard-img">
        <p style="font-size: 1.5rem; margin-top: 25px; line-height: 1.1;">INDEPENDENT HIP HOP / R&B ARTIST & FOUNDER OF GEE RELATED ENTERTAINMENT.</p>
    </section>

    <hr>

    <section id="merch">
        <h2 style="color: #fff; margin-bottom: 10px;">MERCH</h2>
        <p class="old-english-clean">Coming Soon</p>
    </section>

    <hr>

    <section id="visuals">
        <h2>VISUALS</h2>
        <div class="video-wrapper">
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/8_oZoxJNQig?si=L7wWjjIuUf5lVehK" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
        <div class="video-wrapper">
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/6IVTy4s9_7o?si=4Nlmb-cNjGPByPCL" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </section>

    <hr>

    <section id="booking">
        <h2>BOOKING</h2>
        <div class="booking-row">
            <img src="images/onstage.JPG" alt="Booking 1" class="booking-img-small">
            <img src="images/stage.jpg" alt="Booking 2" class="booking-img-small">
        </div>
        <br>
        <a href="mailto:Booking@geerelated.com" class="btn">BOOKING@GEERELATED.COM</a>
    </section>

    <footer>
        <p>© 2026 GEE RELATED ENTERTAINMENT</p>
    </footer>

</body>
</html>
